name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  juce:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 --branch 9.0.3 https://github.com/juce-framework/JUCE.git ../JUCE
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMAGDA_SDK_JUCE_DIR=../JUCE
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release -DMAGDA_SDK_BUILD_TESTS=OFF -DMAGDA_SDK_BUILD_REFERENCE_MODULE=ON
      - run: cmake --build build-wasm
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMAGDA_SDK_BUILD_TESTS=OFF -DMAGDA_SDK_BUILD_REFERENCE_MODULE=ON
      - run: cmake --build build --target sdk_reference_render
      - run: >-
          node hosts/parity/parity.mjs --wasm build-wasm/sdk_reference.wasm
          --render build/sdk_reference_render --corpus hosts/parity/reference-corpus.json
      - run: node hosts/canvas/check.mjs --wasm build-wasm/magda_sdk_ui_demo.wasm
